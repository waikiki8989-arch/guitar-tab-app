<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>{{ result.settings.title }} — 印刷</title><link rel="stylesheet" href="{{ url_for('static', filename='score_print.css') }}"></head>
<body>
<aside class="print-controls"><h1>印刷プレビュー</h1><p>A4・縦・倍率100%で印刷してください。PDFは印刷画面の保存先で「PDFに保存」を選びます。ブラウザーのヘッダーとフッターはオフにしてください。</p>
<button id="print-button" disabled>印刷・PDF保存</button><p id="print-status" role="status">楽譜を準備しています…</p><p>編集画面は元のタブに残っています。</p></aside>
<main id="print-pages"></main><div id="engraving" aria-hidden="true"></div>
<template id="page-heading"><header><h1>{{ result.settings.title }}</h1><p>{% if result.settings.composer %}作曲：{{ result.settings.composer }}　{% endif %}{% if result.settings.arranger %}編曲：{{ result.settings.arranger }}{% endif %}</p><p>標準チューニング（6→1弦）：E2 A2 D3 G3 B3 E4　♩ = {{ '%g'|format(result.preview.tempos[0].bpm) }}</p></header></template>
<script id="print-data" type="application/json">{{ {'xml': result.preview.xml if result.settings.layout == 'both' else result.xml, 'layout': result.settings.layout}|tojson }}</script>
<script defer src="{{ url_for('static', filename='vendor/opensheetmusicdisplay-2.1.2.min.js') }}"></script>
<script defer src="{{ url_for('static', filename='score_print.js') }}"></script>
<noscript>印刷プレビューにはJavaScriptを有効にしてください。</noscript>
</body></html>
