<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Tab App</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>
<body>
    <main>
        <h1>Guitar Tab App</h1>

        <section>
            <h2>コードから作成</h2>

            <form method="post">
                <input type="hidden" name="mode" value="chord">

                <label for="chord">コードを選択</label>

                <select id="chord" name="chord">
                    {% for chord_name in chords %}
                        <option
                            value="{{ chord_name }}"
                            {% if chord_name == selected_chord %}selected{% endif %}
                        >
                            {{ chord_name }}
                        </option>
                    {% endfor %}
                </select>

                <button type="submit">コードのタブ譜を作成</button>
            </form>
        </section>

        <section>
            <h2>フレット番号から作成</h2>
            <p>6弦から1弦の順番で入力してください。</p>

            <form method="post">
                <input type="hidden" name="mode" value="frets">

                <label for="frets">フレット番号</label>

                <input
                    id="frets"
                    name="frets"
                    type="text"
                    value="{{ frets }}"
                    placeholder="例: 0 2 2 1 0 0"
                    required
                >

                <button type="submit">タブ譜を作成</button>
            </form>
        </section>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if tab %}
            <section>
                <h2>生成結果</h2>
                <pre class="tab">{{ tab }}</pre>
            </section>
        {% endif %}
    </main>
</body>
</html>
